name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API — typecheck, lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taskmanager_react_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/taskmanager_react_test?schema=public
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          # actions/setup-node hashes this file to build the npm cache key.
          # package-lock.json is used (not package.json) because it records the
          # exact installed version of every package. package.json only has
          # ranges like "^18.0.0", so its hash would stay the same even when
          # npm resolves a newer patch version — causing a stale cache hit.
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  frontend:
    name: Frontend — typecheck, lint, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_GRAPHQL_HTTP_URL: http://localhost:4000/graphql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          # Same reasoning as the api job: exact versions, not ranges.
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  # Deployment is handled by Railway (api/) and Vercel (frontend/) via their
  # own GitHub integrations, which build on every push to main using
  # api/railway.json and frontend/vercel.json respectively.
  # This job is a placeholder for teams that
  # prefer to trigger deploys explicitly from CI instead of the platforms'
  # native GitHub App integrations.
  deploy:
    name: Deploy (placeholder)
    needs: [api, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: No-op — deploys are triggered by Railway/Vercel GitHub integrations
        run: |
          echo "Skipping explicit deploy step."
          echo "Connect this repo's api/ and frontend/ directories to Railway and Vercel respectively to enable automatic deploys on push to main."
